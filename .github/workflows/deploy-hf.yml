name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Template xlsx/docx e diagrama png estao em LFS: sem isto o checkout
          # traz ponteiros de ~130 bytes e o upload quebraria o Space.
          lfs: true

      - name: Conferir que os arquivos LFS vieram inteiros
        run: |
          set -e
          for f in "MEMORIAL_GD_v4-22022022 (54).xlsx" "PROCURAÇÃO ENERGISA MT - CERÂMICA PROGRESSO.docx"; do
            tamanho=$(stat -c %s "$f")
            echo "$f -> $tamanho bytes"
            if [ "$tamanho" -lt 1000000 ]; then
              echo "ERRO: '$f' parece ponteiro LFS, abortando para nao corromper o Space."
              exit 1
            fi
          done

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          api.upload_folder(
              folder_path=".",
              repo_id="Edimoperondi/Memorial-GD-Solar",
              repo_type="space",
              ignore_patterns=[
                  ".git*",
                  ".planning*",
                  "terraform*",
                  "__pycache__*",
                  "*.pyc",
                  "*.pdf",
                  "data/output*",
                  "pipeline/api/projetos_salvos*",
                  "debug*.py",
                  "test_*.py",
                  "testar_*.py",
              ],
          )
          print("Deploy concluido com sucesso!")
          EOF
